# 当前 EXE 的识别后端。比赛版默认使用本地模型，不需要网络。
# backend: yolo 表示本地识别；改为 vlm 才会走 config/vlm.yaml 的多模态接口。
backend: yolo

# 相对于项目根目录或 EXE 目录的模型路径。
model_path: best.pt

# 推荐先用 0.25；误检多时提高，漏检多时降低。
confidence_threshold: 0.25
iou_threshold: 0.50
image_size: 1280
device: cpu
max_detections: 12
min_mask_area_px: 200
max_length_mm: 500

# 过滤紧贴画面边缘、明显被裁切的异常检测框。
border_margin_px: 8

# best.pt 内的 12 个英文类别名到界面显示名的映射。其他类别结果会被忽略。
class_names:
  building block: 积木块
  diamond: 钻石
  mint candy: 薄荷糖
  peanut: 花生
  qingtuan: 青团
  quail egg: 鹌鹑蛋
  raisins: 葡萄干
  screw cap: 瓶盖
  soft candy: 软糖
  soybean: 黄豆
  steamed bread: 馒头
  toffee: 太妃糖

# 识别到对应类别后直接输出的固定易卡物等级。
class_levels:
  building block: 一般易卡物
  diamond: 一般易卡物
  mint candy: 较易卡物
  peanut: 极易卡物
  qingtuan: 极易卡物
  quail egg: 较易卡物
  raisins: 极易卡物
  screw cap: 一般易卡物
  soft candy: 较易卡物
  soybean: 较易卡物
  steamed bread: 极易卡物
  toffee: 较易卡物
