[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swallow-yolo"
version = "0.1.0"
description = "Fixed-camera YOLO demonstration for small-object swallowing-risk assistance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
